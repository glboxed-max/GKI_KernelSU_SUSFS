name: Apply Kernel Bypass Hack
description: >
  ⚠️ 危险（DANGER，实测已导致内核 BUG 级黑屏，见 D:\neiheidaima\_re\ABI_结论.md §4）：
  本 action 把 kernel/module/version.c 里 bad_version: 分支的 `return 0;` 改成 `return 1;`，
  等于**关掉整个 modversions CRC 校验（ABI 门）**，且不产生 TAINT_FORCED_MODULE，
  因此日志里看不出端倪（只有 P O，没有 F）。
  后果：与内核 ABI 不符的厂商预编译模块会带着**错位的结构体偏移**进入内核运行；
  在 vivo PD2339 上实测表现为 vivo_ts.ko 在 netlink 建线程失败后走它自己的回滚路径
  （input_free_device → refcount_t underflow → list_del corruption → kernel BUG at lib/list_debug.c:50）。
  它换来的不是“能用”，而是“厂商模块带错位偏移进来跑然后崩在厂商自己的 bug 上”。
  正确做法是让内核确定性拒载（模块不工作但内核不崩），而不是绕过校验。
  Disabled by default; 除非明确知道后果，否则不要传 bypass: true。
inputs:
  bypass:
    description: 'Whether to apply the bypass hack（默认 false，危险，勿开）'
    required: false
    type: boolean
    default: false
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
runs:
  using: composite
  steps:
    - name: Activate Bypass
      if: ${{ inputs.bypass == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        echo "=============================================================="
        echo "⚠️  WARNING: 正在关闭 modversions CRC 校验（ABI 门）"
        echo "⚠️  实测后果：ABI 不符的厂商模块会带错位偏移运行，可能导致 kernel BUG / 黑屏"
        echo "⚠️  详见 D:\\neiheidaima\\_re\\ABI_结论.md §4 —— 除非明确知情，请勿使用本开关"
        echo "=============================================================="

        if [[ "${{ inputs.version }}" == "android14-6.1" \
            || "${{ inputs.version }}" == "android15-6.6" \
            || "${{ inputs.version }}" == "android16-6.12" ]]; then
          TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module/version.c"
        else
          TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module.c"
        fi

        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "Patch failed! 'return 1;' not found at bad_version:" >&2
          grep -A 10 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi
        echo "Bypass hack applied to $TARGET_FILE"
