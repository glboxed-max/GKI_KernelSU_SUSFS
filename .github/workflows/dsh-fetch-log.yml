name: DSH Fetch Failed Build Log

# 目的：建立一条【无需任何 token 就能读】的反馈通道。
#   CI 的 GITHUB_TOKEN 带 actions:read，能读本仓库的运行日志；
#   把日志提交回仓库后，任何人在没有 token 的情况下用 git fetch 就能读到失败原因。
#
# 触发：定时（每 10 分钟）+ 手动 + 改动本文件时。
# 注意：用 GITHUB_TOKEN 推送不会再次触发 workflow run，且提交信息带 [skip ci]，双重保险。

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dsh-fetch-log.yml'

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 抓取最近的运行概况
        run: |
          mkdir -p ci-logs
          {
            echo "# 运行概况快照 $(date -u +%FT%TZ)"
            echo
            echo '```'
            gh api "repos/${REPO}/actions/runs?per_page=25" \
              --jq '.workflow_runs[] | "\(.id)  \(.name)  \(.status)/\(.conclusion)  \(.head_sha[0:8])  \(.created_at)"' 2>&1 || true
            echo '```'
          } > ci-logs/runs-summary.md
          echo "概况: $(wc -l < ci-logs/runs-summary.md) 行"

      - name: 抓取最近一次失败的 CRC Probe 日志
        run: |
          set -u
          RID=$(gh api "repos/${REPO}/actions/runs?per_page=40" \
                 --jq '[.workflow_runs[] | select(.name|startswith("CRC Probe")) | select(.conclusion=="failure")][0].id' 2>/dev/null || echo "")
          echo "最近失败的 CRC Probe 运行 id = ${RID:-（无）}"
          if [ -z "$RID" ] || [ "$RID" = "null" ]; then
            echo "(没有失败的 CRC Probe 运行)" > ci-logs/latest-failure.md
            exit 0
          fi
          OUT="ci-logs/latest-failure.md"
          {
            echo "# 最近失败的 CRC Probe 运行 ${RID}"
            echo
            echo "## 元信息"
            echo '```'
            gh api "repos/${REPO}/actions/runs/${RID}" \
              --jq '"name=\(.name)\nsha=\(.head_sha)\nconclusion=\(.conclusion)\ncreated=\(.created_at)\nupdated=\(.updated_at)"' 2>&1 || true
            echo '```'
            echo
            echo "## 各步骤状态"
            echo '```'
            gh api "repos/${REPO}/actions/runs/${RID}/jobs" \
              --jq '.jobs[] | "JOB \(.name) \(.status)/\(.conclusion)", (.steps[] | "  \(.number) \(.status)/\(.conclusion) \(.name)")' 2>&1 || true
            echo '```'
            echo
            echo "## 编译错误行（已过滤）"
            echo '```'
            gh run view "${RID}" --log 2>/dev/null \
              | grep -E "error:|Error [0-9]|fatal|BUILD_BUG_ON|undeclared|No such file|expected|FAILED:" \
              | head -200 || echo '(无匹配)'
            echo '```'
            echo
            echo "## 失败步骤完整日志"
            echo '```'
            gh run view "${RID}" --log-failed 2>&1 | tail -400 || gh run view "${RID}" --log 2>&1 | tail -400 || echo '(取不到)'
            echo '```'
          } > "${OUT}"
          echo "写入 ${OUT}: $(wc -c < "${OUT}") 字节"

      - name: 抓取最近成功的 CRC Probe 产物清单
        run: |
          set -u
          RID=$(gh api "repos/${REPO}/actions/runs?per_page=40" \
                 --jq '[.workflow_runs[] | select(.name|startswith("CRC Probe")) | select(.conclusion=="success")][0].id' 2>/dev/null || echo "")
          echo "最近成功的 CRC Probe 运行 id = ${RID:-（无）}"
          {
            echo "# 最近成功的 CRC Probe 运行 ${RID:-无}"
            echo
            if [ -n "$RID" ] && [ "$RID" != "null" ]; then
              echo '```'
              gh api "repos/${REPO}/actions/runs/${RID}" --jq '"sha=\(.head_sha)\ncreated=\(.created_at)"' 2>&1 || true
              echo '```'
              echo
              echo "## 产物"
              echo '```'
              gh api "repos/${REPO}/actions/runs/${RID}/artifacts" --jq '.artifacts[] | "\(.id)  \(.name)  \(.size_in_bytes) bytes  expired=\(.expired)"' 2>&1 || true
              echo '```'
              echo
              echo "## Release 资产（公开可取）"
              echo '```'
              gh release list --limit 10 2>&1 || true
              echo '```'
            else
              echo "(暂无成功的 CRC Probe 运行)"
            fi
          } > ci-logs/latest-success.md

      - name: 提交回仓库
        run: |
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-bot"
          git add -f ci-logs
          if git diff --cached --quiet; then
            echo "没有变化，无需提交"
          else
            git commit -m "ci: 运行日志/产物快照 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && echo "已推送" || echo "推送失败（忽略）"
          fi
