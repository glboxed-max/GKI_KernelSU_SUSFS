name: CRC Probe (原厂 config ABI 对齐验证)

# 目的：用「厂商设备的 /proc/config.gz」去编 AOSP 6.1.145 树（可叠加 BTF 反推的头文件补丁），
#       产出 Image 后本地解析 __ksymtab/__kcrctab + BTF，与厂商模块逐项对比。
#       全程无需刷机。

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: 'OS patch level（对应设备内核 6.1.145）'
        required: true
        default: '2025-09'
      use_device_defconfig:
        description: '用 .github/config/vivo_pd2339_a16_defconfig 覆盖 gki_defconfig'
        type: boolean
        default: true
      use_abi_patches:
        description: '应用 .github/patches/abi 下 BTF 反推的头文件补丁'
        type: boolean
        default: true
  # 自动触发：只要 ABI 补丁 / 设备 config / 本 workflow 有推送，就自动构建一炉。
  # 这样任何人的补丁改动都会被自动验证，且成功产物会挂到公开 Release（便于无 token 获取）。
  # 注意：push 事件下 inputs.* 为空，所以下面所有用到 inputs 的地方都做了兜底。
  push:
    branches: [main]
    paths:
      - '.github/patches/**'
      - '.github/config/vivo_pd2339_a16_defconfig'
      - '.github/workflows/crc-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: 安装 repo 工具 + 准备目录
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/git-repo" "$GITHUB_WORKSPACE/kernel" "$GITHUB_WORKSPACE/AnyKernel3"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: 同步 AOSP 内核源码（android14-6.1 / 2025-09 = 6.1.145）
        uses: ./.github/actions/download-kernel
        with:
          android_version: android14
          kernel_version: '6.1'
          version: android14-6.1
          os_patch_level: ${{ inputs.os_patch_level || '2025-09' }}

      - name: 用原厂 config 覆盖 gki_defconfig
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_device_defconfig }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.github/config/vivo_pd2339_a16_defconfig" \
             "$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig"
          echo "配置行数: $(grep -c . "$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig")"

      - name: 关掉 WERROR（-Warray-bounds 会误伤，且不影响 ABI）
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig"
          sed -i 's/^CONFIG_WERROR=y/# CONFIG_WERROR is not set/' "$D"
          grep -q '^\(# \)\?CONFIG_WERROR' "$D" || echo '# CONFIG_WERROR is not set' >> "$D"
          grep -n 'CONFIG_WERROR' "$D"

      - name: 应用 BTF 反推的 ABI 补丁
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_abi_patches }}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.github/patches/abi"
          cd "$GITHUB_WORKSPACE/kernel/common"
          n=0
          while IFS= read -r f; do
            rel="${f#$SRC/}"
            cp "$f" "$rel"
            echo "[+] 覆盖 $rel"
            n=$((n+1))
          done < <(find "$SRC" -type f)
          echo "共应用 $n 个头文件补丁"

      - name: 构建 Image（自动补齐 module_outs 并重试）
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -uo pipefail
          sed -i 's/check_defconfig//' ./common/build.config.gki
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          # 说明：曾尝试在此处 sed 删除 kmi_symbol_list / protected_exports_list 以关掉裁剪，
          # 但 Kleaf 的 //common:kernel_aarch64_raw_kmi_symbol_list 目标依赖该属性，
          # 删除后构建在 "Creating abi_symbollist.raw" 阶段失败（Exit 1）。
          # 正确做法是改"是否裁剪"这个开关，而不是删清单 —— 见 INVESTIGATION_STATE.md §12-A。
          echo "===== KMI 裁剪现状（仅供观察，不做修改）====="
          grep -n -E '"kmi_symbol_list"|"protected_exports_list"|"additional_kmi_symbol_lists"' common/BUILD.bazel || echo "（未找到，可能构建链不同）"
          ok=0
          for i in 1 2 3 4; do
            echo "===== Bazel 构建 第 $i 次 ====="
            if tools/bazel build --config=fast --disk_cache=/home/runner/.cache/bazel \
                 //common:kernel_aarch64/Image > /tmp/bazel.log 2>&1; then
              ok=1; break
            fi
            echo "----- 真实 error 行（最多 40 条）-----"
            grep -n -m 40 -E "error:|Error [0-9]|fatal error|BUILD_BUG_ON|No such file or directory|undeclared|note: expanded from macro|expected" /tmp/bazel.log || true
            echo "----- tail 40 -----"
            tail -40 /tmp/bazel.log || true
            python3 "$GITHUB_WORKSPACE/.github/tools/bazel_module_outs.py" /tmp/bazel.log common/BUILD.bazel || break
          done
          [ "$ok" = "1" ] || { echo "构建失败"; exit 1; }

      - name: 打印生效后的 .config 关键项（诊断导出裁剪机制）
        if: always()
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -uo pipefail
          CFG=""
          for c in bazel-bin/common/kernel_aarch64/.config common/bazel-bin/common/kernel_aarch64/.config; do
            [ -f "$c" ] && CFG="$c" && break
          done
          if [ -z "$CFG" ]; then
            echo "=== 找不到生效 .config，全树查找 ==="
            find . -maxdepth 7 -name '.config' -path '*kernel_aarch64*' 2>/dev/null | head
            exit 0
          fi
          echo "=== 生效配置: $CFG ==="
          echo "  总行数: $(grep -c . "$CFG")    CONFIG_* 行数: $(grep -c '^CONFIG_' "$CFG")"
          echo "  （对照：设备实际 config 为 9246 行 / 3028 项）"
          echo "=== 裁剪 / 导出 / LTO 相关 ==="
          grep -E '^#? ?CONFIG_(TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODVERSIONS|MODULE_SIG|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL|LTO_NONE)' "$CFG" || echo "  （以上各项均未出现）"
          echo "=== 驱动内建/模块统计 ==="
          echo "  =y : $(grep -c '=y$' "$CFG")    =m : $(grep -c '=m$' "$CFG")"
          echo "=== System.map 里的导出符号条目数（直接印证 __ksymtab 数）==="
          for m in bazel-bin/common/kernel_aarch64/System.map common/bazel-bin/common/kernel_aarch64/System.map; do
            if [ -f "$m" ]; then
              echo "  $m"
              echo "    __ksymtab_ 条目: $(grep -c '__ksymtab_' "$m")"
              echo "    __kcrctab_ 条目: $(grep -c '__kcrctab_' "$m")"
              echo "    module_layout : $(grep -m1 ' __ksymtab_module_layout$' "$m" || echo '(未找到)')"
              break
            fi
          done
          echo "=== bazel 配置串（看 lto=...;trim 是否存在）==="
          grep -m 3 -E 'Building kernel \(' /tmp/bazel.log 2>/dev/null || echo "  （日志中未出现）"

      - name: 定位 Kleaf 里开启 TRIM_UNUSED_KSYMS 的规则（只打印，不改）
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          echo "===== 搜索 Kleaf 中与 KMI 裁剪相关的规则 ====="
          echo "--- 候选目录 ---"
          for d in kernel/build build/kernel/kleaf kernel/common/kleaf .; do
            [ -d "$d" ] && echo "  存在: $d"
          done
          echo "--- 含 TRIM_UNUSED_KSYMS / UNUSED_KSYMS_WHITELIST 的文件 ---"
          grep -rln -E 'TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST' \
            --include='*.bzl' --include='*.bazel' --include='*.py' --include='*.sh' \
            kernel/build build/kernel/kleaf 2>/dev/null | head -20 || echo "  （未找到）"
          echo "--- 命中行（最多 40 条）---"
          grep -rn -E 'TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|unused_ksyms_whitelist|abi_symbollist' \
            --include='*.bzl' --include='*.bazel' --include='*.py' --include='*.sh' \
            kernel/build build/kernel/kleaf 2>/dev/null | head -40 || echo "  （未找到）"
          echo "--- kernel_build 规则里与 kmi 相关的属性 ---"
          grep -rn -E '"kmi_symbol_list"|kmi_symbol_list_strict_mode|trim_nonlisted_kmi|unused_ksyms' \
            --include='*.bzl' --include='*.bazel' \
            kernel/build build/kernel/kleaf 2>/dev/null | head -25 || echo "  （未找到）"

      - name: 失败时上传 bazel 日志（供无 token 的协作者取用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-log
          path: /tmp/bazel.log
          if-no-files-found: ignore

      - name: 收集产物
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          IMG=""
          for c in bazel-bin/common/kernel_aarch64/Image common/bazel-bin/common/kernel_aarch64/Image; do
            [ -f "$c" ] && IMG="$c" && break
          done
          [ -n "$IMG" ] || { echo "找不到 Image"; find . -name Image -path '*kernel_aarch64*' | head; exit 1; }
          cp "$IMG" "$GITHUB_WORKSPACE/AnyKernel3/Image"
          ls -l "$GITHUB_WORKSPACE/AnyKernel3/Image"
          strings "$GITHUB_WORKSPACE/AnyKernel3/Image" | grep -m1 "SMP preempt mod_unload" || true

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: crc-probe-Image
          path: ${{ github.workspace }}/AnyKernel3/Image
          if-no-files-found: error
          compression-level: 0

      - name: 把 Image 挂到公开 Release（便于无 token 获取）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TAG="crc-probe-${GITHUB_SHA:0:8}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "CRC Probe ${GITHUB_SHA:0:8}" \
            --notes "自动发布：crc-probe 构建产物 Image（commit ${GITHUB_SHA}）。Release asset 公开，可直接下载。" \
            "$GITHUB_WORKSPACE/AnyKernel3/Image" \
          && echo "已发布 Release $TAG" || echo "Release 发布失败（忽略，不影响后续）"
